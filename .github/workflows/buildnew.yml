name: Build PMCA-RE for Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags, needed for the version stamp

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Remove module exclusions from build.spec
        run: (Get-Content build.spec) -replace '^excludes = \[.*\]', 'excludes = []' | Set-Content build.spec
        
      - name: Get libusb0.dll
        run: |
          Invoke-WebRequest https://github.com/mcuee/libusb-win32/releases/download/release_1.4.0.2/libusb-win32-bin-1.4.0.2.zip -OutFile libusb.zip
          Expand-Archive libusb.zip -DestinationPath libusb
          Copy-Item libusb\libusb-win32-bin-1.4.0.2\bin\amd64\libusb0.dll .
          "$PWD" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append  
          
      - name: Build executables
        run: |
          python -OO -m PyInstaller pmca-gui.spec
          python -OO -m PyInstaller pmca-console.spec

      - uses: actions/upload-artifact@v4
        with:
          name: pmca-windows
          path: dist/*
          retention-days: 90
